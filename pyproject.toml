[project]
name = "hmumu_transformer"
version = "0.2.0"
description = "Event-level Transformer with streaming token shards for H->mumu classification."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyarrow>=12",
  "pyyaml>=6.0",
  "torch>=2.1",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
