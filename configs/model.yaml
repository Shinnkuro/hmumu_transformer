model:
  d_model: 192
  n_particle_layers: 3
  n_class_layers: 2
  n_heads: 6
  dropout: 0.1

  # Pairwise feature dimension:
  # [ln Delta, ln kT, ln z, ln m^2]
  pairwise_dim: 4
  pairwise_hidden: 64

  classifier_head:
    hidden: 128
    dropout: 0.1

  adversary_head:
    hidden: 128
    dropout: 0.1
